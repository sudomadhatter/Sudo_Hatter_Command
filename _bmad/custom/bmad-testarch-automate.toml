# Team override for bmad-testarch-automate — TDAD dialect pin + evidence insurance
# Lives in _bmad/custom/ — survives BMAD skill updates.
#
# WHY (testing_audit_BDD 2026-07-09): (a) same Playwright/Cypress-vs-pytest-bdd
# dialect mismatch as bmad-testarch-atdd.toml; (b) the audit found 13 of 14
# Epic-8 ATDD stories finished green with NO automate expansion pass and no
# evidence trail. The ② dev command and the ③ gate now check for
# automation-summary-<story>.md — this on_complete makes the skill itself
# produce that evidence, so the check never fires on a story that DID run.
#
# Merge rules: persistent_facts APPEND; on_complete OVERRIDE-WINS (skill
# default is empty, so no conflict).

[workflow]

persistent_facts = [
  "TEST DIALECT (TDAD Layer 1 — non-negotiable): coverage expansion in this project is pytest + pytest-bdd (Python). NEVER scaffold Cypress or Jest. Playwright is reserved for explicitly E2E/UI-journey-level work — everything else is pytest. Translate JS-framework suggestions from your checklists into pytest/pytest-bdd idiom.",
  "BDD LAYOUT (house convention): Gherkin contracts at {project-root}/backend/tests/features/<domain>/<name>.feature; SELF-BINDING steps at {project-root}/backend/tests/bdd/steps_<domain>.py (each calls pytest_bdd.scenarios(); pyproject collects steps_*.py). Expansion tests that formalize behavior contracts should prefer this layer; plain pytest unit/integration tests go under backend/tests/ as usual.",
]

on_complete = """Before you finish: persist this run's summary as {project-root}/_bmad-output/test-artifacts/automation-summary-<story>.md — what was expanded (files + test names), what was deliberately not covered and why, and the suite result. The /sudo-code-review gate's automate-evidence check (check 5) looks for EXACTLY this file; without it a feature story's verdict is capped at CONCERNS. If you were invoked without a story id, name the file automation-summary-<YYYY-MM-DD>-<slug>.md instead."""
