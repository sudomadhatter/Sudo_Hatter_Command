# NO SUBTASKS, so no `riders:` key. Proposed at /smh-plan-task Step 2 and refused the bar: the two
# parts are strictly sequential in one repo pair — the detector cannot be written until the files it
# declares are at parity — so neither earns its own branch. A ticket with no branch is a row nothing
# writes to.
#
# `sudo-project-skeleton` is a SUBMODULE. Part A edits four of its files; they land by their own PR
# in that repo (its commit gate no-ops — jira.conf.example ships JIRA_KEYS="" — so an SCC-keyed
# commit is accepted, as SCC-441 already proved). This lane carries the lobby's detector and the
# pointer bump.
#
# ⚠ Projects/AGY_AVIATIONCHAT is DELIBERATELY NOT a secondary repo here. The detector declares it as
# a consumer and will report its 5 dead rule paths, but its armed commit-msg gate rejects an SCC key
# by design (port-checklist check 6), so this lane physically cannot land there. That repair needs an
# AVCH key and is named in the plan's `## Your Actions`.
secondary_repos:
  - repo: Projects/sudo-project-skeleton
    landing: independent-task
    ticket: SCC-459
